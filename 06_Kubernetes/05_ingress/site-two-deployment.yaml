apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx-site-two
  labels:
    app: site-two
spec:
  replicas: 2
  selector:
    matchLabels:
      app: site-two
  template:
    metadata:
      labels:
        app: site-two
    spec:
      containers:
        - name: nginx-container
          image: nginx:alpine
          ports:
            - containerPort: 80
          command: ["/bin/sh", "-c"]
          args:
            - |
              echo "<html><body style='background-color: #e74c3c; text-align: center; color: white; font-family: sans-serif; padding-top: 100px;'><h1>Welcome to SITE TWO (NGINX)</h1><p>This is the RED website managed by Kubernetes.</p></body></html>" > /usr/share/nginx/html/index.html
              nginx -g 'daemon off;'