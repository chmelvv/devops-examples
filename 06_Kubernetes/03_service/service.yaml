apiVersion: v1
kind: Service
metadata:
  name: whoami-service
spec:
  type: NodePort
  selector:
    app: webserver
  ports:
  - port: 80 #port on service ClusterIP to access the pods
    targetPort: 80 # port on pod to access the container
    nodePort: 32000 #port on node to access the service http://<NodeIP>:32000