apiVersion: apps/v1
kind: Deployment
metadata:
  name: myapp-deployment
  labels:
    app: myapp
spec:
  replicas: 2
  selector:
    matchLabels:
      app: myapp
  template:
    metadata:
      labels:
        app: myapp
    spec:
      containers:
      - name: myapp-container
        image: chmelvv/myapp:v4 # updated image with stub_status
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 80
        resources:
          requests:
            cpu: "100m"
            memory: "64Mi"
          limits:
            cpu: "250m"
            memory: "128Mi"
            
        # Sidecar container to export metrics
      - name: nginx-exporter
        image: nginx/nginx-prometheus-exporter:latest
        args:
          # where to get raw metrics
          - -nginx.scrape-uri=http://localhost:80/stub_status
        ports:
        - containerPort: 9113 # port to gather metrics from nginx-exporter
          name: metrics